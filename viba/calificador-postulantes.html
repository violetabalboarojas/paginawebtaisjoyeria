<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Calificador de postulantes VIBA</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<style>
:root{
  --azul:#16427a; --azul2:#2563b0; --azul3:#3b82f6; --noche:#0d2447;
  --fondo:#f3f5f9; --card:#fff; --texto:#1c2533; --suave:#5d6b7e; --borde:#e1e6ee; --linea:#eef1f5;
  --ok:#0ca30c; --warn:#fab219; --neutro:#9aa3ae; --crit:#d03b3b;
  --r:14px; --sombra:0 1px 2px rgba(16,32,64,.05),0 4px 16px rgba(16,32,64,.06);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--fondo);color:var(--texto);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit}
a{color:var(--azul2)}
svg{flex-shrink:0}

/* ---------- login ---------- */
.login{min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr}
.login-brand{background:radial-gradient(1200px 600px at 10% 10%,#2f6fd0 0%,transparent 60%),linear-gradient(150deg,#0d2447 0%,#16427a 55%,#2563b0 100%);color:#fff;padding:48px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.login-brand::after{content:"";position:absolute;right:-120px;bottom:-120px;width:420px;height:420px;border-radius:50%;border:60px solid rgba(255,255,255,.06)}
.login-brand h1{font-size:34px;line-height:1.15;margin:28px 0 12px;max-width:480px}
.login-brand p{color:#cfe0f7;max-width:460px;margin:0 0 24px}
.login-brand ul{list-style:none;padding:0;margin:0;display:grid;gap:12px;max-width:440px}
.login-brand li{display:flex;gap:12px;align-items:flex-start;color:#e4eefb;font-size:14px}
.login-brand li i{width:28px;height:28px;border-radius:8px;background:rgba(255,255,255,.12);display:grid;place-items:center;flex-shrink:0}
.login-side{display:grid;place-items:center;padding:32px 20px}
.login-card{width:100%;max-width:400px;background:#fff;border-radius:18px;box-shadow:var(--sombra);padding:32px;border:1px solid var(--borde)}
.login-card h2{margin:0 0 4px;font-size:22px}
.login-card .sub{color:var(--suave);font-size:14px;margin:0 0 20px}
.login-card label{display:block;font-size:13px;font-weight:600;margin:14px 0 6px}
.login-card input,.login-card select{width:100%;padding:11px 12px;border:1px solid var(--borde);border-radius:10px;font:inherit;background:#fbfcfe}
.login-card input:focus{outline:2px solid #bcd3f5;border-color:var(--azul2)}
.login-card .btn.pri{width:100%;justify-content:center;padding:12px;margin-top:20px;font-size:15px}
.login-card .pie{font-size:12px;color:var(--suave);margin-top:16px;text-align:center}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.04em}
.logo b{width:40px;height:40px;border-radius:11px;background:linear-gradient(135deg,#fff,#cfe0f7);color:var(--azul);display:grid;place-items:center}
.logo small{display:block;font-weight:500;letter-spacing:0;font-size:12px;opacity:.8}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:252px 1fr;min-height:100vh}
.side{background:linear-gradient(180deg,#0d2447,#16427a);color:#fff;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;z-index:60}
.side .logo{padding:22px 20px 18px}
.side nav{display:flex;flex-direction:column;gap:2px;padding:6px 10px;overflow-y:auto}
.side nav .grp{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:#8fb0dc;margin:14px 12px 6px}
.side nav button{display:flex;align-items:center;gap:12px;background:transparent;border:0;color:#cfdcf0;padding:10px 12px;border-radius:10px;cursor:pointer;text-align:left;font-size:14px}
.side nav button:hover{background:rgba(255,255,255,.07);color:#fff}
.side nav button.on{background:#fff;color:var(--azul);font-weight:600;box-shadow:0 4px 14px rgba(0,0,0,.18)}
.side nav button .cnt{margin-left:auto;font-size:11px;background:rgba(255,255,255,.15);padding:1px 7px;border-radius:10px}
.side nav button.on .cnt{background:#e7effb}
.side .yo{margin-top:auto;padding:14px 16px;border-top:1px solid rgba(255,255,255,.12);display:flex;align-items:center;gap:10px}
.avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#3b82f6,#8ab4f8);display:grid;place-items:center;font-weight:700;color:#fff;flex-shrink:0}
.side .yo div{flex:1;min-width:0;font-size:13px;line-height:1.3}
.side .yo small{color:#9fbbe0}
.side .yo button{background:rgba(255,255,255,.1);border:0;color:#fff;border-radius:8px;padding:7px;cursor:pointer}
.main{min-width:0}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:rgba(243,245,249,.88);backdrop-filter:blur(10px);padding:16px 28px;display:flex;align-items:center;gap:12px}
.topbar h1{font-size:21px;margin:0;line-height:1.2}
.topbar p{margin:0;color:var(--suave);font-size:13px}
.topbar .acc{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.btn.menuBtn{display:none}
.content{padding:4px 28px 40px;max-width:1360px}
.scrim{display:none}

/* ---------- componentes ---------- */
.card{background:var(--card);border:1px solid var(--borde);border-radius:var(--r);padding:20px;margin-bottom:18px;box-shadow:var(--sombra)}
.card h2{font-size:16px;margin:0 0 4px}
.card .desc{color:var(--suave);font-size:13px;margin:0 0 14px}
.card h3{font-size:12px;margin:18px 0 8px;color:var(--suave);text-transform:uppercase;letter-spacing:.06em}
.grid{display:grid;gap:18px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.hero{background:radial-gradient(700px 300px at 90% 0%,rgba(255,255,255,.18),transparent 60%),linear-gradient(130deg,#0d2447,#16427a 45%,#2563b0);color:#fff;border-radius:18px;padding:26px 28px;margin-bottom:18px;display:flex;gap:20px;align-items:center;flex-wrap:wrap;box-shadow:0 10px 30px rgba(22,66,122,.25)}
.hero h2{margin:0 0 6px;font-size:24px}
.hero p{margin:0;color:#d6e4f7;font-size:14px}
.hero .acc{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.hero .btn{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.25);color:#fff}
.hero .btn.blanco{background:#fff;color:var(--azul);border-color:#fff}
.hero .anillo{display:flex;align-items:center;gap:14px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:18px}
.kpi{background:#fff;border:1px solid var(--borde);border-radius:var(--r);padding:16px;box-shadow:var(--sombra);display:flex;gap:12px;align-items:center;text-align:left;cursor:default}
.kpi[data-act]{cursor:pointer;transition:transform .12s,box-shadow .12s}
.kpi[data-act]:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(16,32,64,.1)}
.kpi .ico{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;flex-shrink:0}
.kpi b{display:block;font-size:26px;line-height:1.05}
.kpi span{font-size:12px;color:var(--suave)}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--borde);background:#fff;color:var(--texto);padding:8px 13px;border-radius:10px;font-size:14px;cursor:pointer;text-decoration:none;white-space:nowrap;transition:background .12s,border-color .12s}
.btn:hover{border-color:var(--azul2)}
.btn.pri{background:var(--azul2);border-color:var(--azul2);color:#fff}
.btn.pri:hover{background:var(--azul)}
.btn.wa{background:#128c4a;border-color:#128c4a;color:#fff}
.btn.peligro{color:var(--crit)}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:8px}
.btn[disabled],.btn.off{opacity:.45;pointer-events:none}
.fila{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input,select,textarea{font:inherit;font-size:14px;padding:8px 10px;border:1px solid var(--borde);border-radius:10px;background:#fff;color:var(--texto);max-width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid #cfe0f7;border-color:var(--azul2)}
textarea{width:100%;min-height:80px;resize:vertical}
label.campo{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--suave);font-weight:600}
label.campo input,label.campo select,label.campo textarea{color:var(--texto);font-weight:400}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.drop{border:2px dashed #a9bddb;border-radius:16px;padding:40px 20px;text-align:center;background:linear-gradient(180deg,#f8fbff,#eef4fd);cursor:pointer;transition:all .15s}
.drop:hover,.drop.sobre{border-color:var(--azul2);background:#e6f0fd}
.drop .big{width:56px;height:56px;border-radius:16px;background:#fff;display:grid;place-items:center;margin:0 auto 12px;color:var(--azul2);box-shadow:var(--sombra)}
.nota{font-size:13px;color:var(--suave)}
.aviso,.error,.okmsg{border-radius:10px;padding:10px 12px;font-size:13px;margin:8px 0}
.aviso{background:#fff7e0;border:1px solid #f0d58a}
.error{background:#fdecec;border:1px solid #f2b3b3}
.okmsg{background:#e8f6ee;border:1px solid #a9dcbf}
.filtros{display:grid;grid-template-columns:2fr repeat(6,minmax(130px,1fr));gap:8px;margin-bottom:12px}
.tablawrap{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--suave);font-weight:600;border-bottom:1px solid var(--borde);padding:8px 10px;white-space:nowrap;background:#fafbfd}
table.t td{border-bottom:1px solid var(--linea);padding:10px;vertical-align:top}
table.t tr.click{cursor:pointer}
table.t tr.click:hover td{background:#f5f8fd}
.nombre{font-weight:600}
.sub2{font-size:12px;color:var(--suave)}
.bar{height:8px;background:#eceff4;border-radius:6px;overflow:hidden;min-width:80px}
.bar i{display:block;height:100%;border-radius:6px}
.avance{display:flex;flex-direction:column;gap:4px;min-width:120px}
.avance small{font-size:12px;color:var(--suave)}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;padding:3px 9px 3px 7px;border-radius:20px;white-space:nowrap;letter-spacing:.02em;background:#f1f3f7;color:var(--texto);border:1px solid var(--borde)}
.badge i{width:8px;height:8px;border-radius:50%;display:inline-block}
.motivo{font-size:12px;color:var(--suave);margin-top:4px}
.chart svg{width:100%;height:auto;display:block}
.chart .mk{transition:opacity .12s}
.chart g[data-act]{cursor:pointer}
.chart g[data-act]:hover .mk,.chart path.mk:hover{opacity:.8}
.meter{margin:10px 0}
.meter .top{display:flex;justify-content:space-between;font-size:14px;margin-bottom:5px;gap:8px}
.meter .bar{height:10px}
.lista{display:flex;flex-direction:column}
.lista .it{display:flex;align-items:center;gap:10px;padding:9px 4px;border-bottom:1px solid var(--linea);cursor:pointer}
.lista .it:hover{background:#f7f9fc}
.lista .it .n{flex:1;min-width:0}
.lista .vacio{padding:10px 4px;color:var(--suave);font-size:13px}
.acciones{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:18px}
.acciones .card h2{display:flex;align-items:center;gap:8px}
.pill{font-size:12px;background:#eef3fb;color:var(--azul);padding:2px 9px;border-radius:12px;font-weight:700}
.req{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.reqbtn{border:2px solid var(--borde);border-radius:12px;padding:12px;text-align:left;background:#fff;cursor:pointer}
.reqbtn b{display:block;font-size:14px}
.reqbtn span{font-size:12px;font-weight:700}
.reqbtn small{display:block;font-size:11px;color:var(--suave);margin-top:3px}
.reqbtn.CUMPLE{border-color:var(--ok);background:#eef9ee}.reqbtn.CUMPLE span{color:#087a08}
.reqbtn.FALTA{border-color:var(--crit);background:#fdf0f0}.reqbtn.FALTA span{color:#a52222}
.reqbtn.PENDIENTE span{color:var(--suave)}
.overlay{position:fixed;inset:0;background:rgba(13,36,71,.55);z-index:80;display:flex;justify-content:center;align-items:flex-start;overflow-y:auto;padding:28px 14px;backdrop-filter:blur(2px)}
.modal{background:var(--fondo);border-radius:18px;max-width:1000px;width:100%;box-shadow:0 30px 60px rgba(0,0,0,.3)}
.modal .mhead{background:linear-gradient(130deg,#0d2447,#16427a 60%,#2563b0);color:#fff;border-radius:18px 18px 0 0;padding:20px 22px;display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.modal .mhead .motivo{color:#d6e4f7}
.modal .mhead .btn{background:rgba(255,255,255,.14);border-color:transparent;color:#fff}
.modal .mbody{padding:18px 18px 6px}
dl.datos{display:grid;grid-template-columns:max-content 1fr;gap:6px 14px;margin:0;font-size:14px}
dl.datos dt{color:var(--suave)}
dl.datos dd{margin:0;word-break:break-word}
.tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:6px;background:#eef1f5;color:var(--suave);margin-left:4px}
.tag.w{background:#fff1cc;color:#8a6200}
.tag.r{background:#fde1e1;color:#a52222}
.tag.b{background:#e7effb;color:var(--azul)}
.hist{font-size:13px;max-height:280px;overflow:auto}
.hist div{border-bottom:1px solid var(--linea);padding:7px 0}
.tests div{padding:7px 0;border-bottom:1px solid var(--linea);font-size:14px}
.tabs2{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.tabs2 button{border:1px solid var(--borde);background:#fff;border-radius:20px;padding:6px 14px;cursor:pointer;font-size:13px}
.tabs2 button.on{background:var(--azul);color:#fff;border-color:var(--azul)}
.correo-prev{background:#eef1f5;border-radius:12px;padding:18px;overflow-x:auto}
.gridRep{display:grid;gap:18px;grid-template-columns:minmax(280px,360px) 1fr;align-items:start}
.gridRep>.card:first-child{position:sticky;top:90px}
.dlg{position:fixed;inset:0;background:rgba(13,36,71,.55);z-index:120;display:grid;place-items:center;padding:16px}
.dlg .caja{background:#fff;border-radius:16px;max-width:440px;width:100%;padding:22px;box-shadow:0 30px 60px rgba(0,0,0,.3)}
.dlg h2{margin:0 0 8px;font-size:18px}
.dlg p{margin:0 0 12px;color:var(--suave);font-size:14px;white-space:pre-line}
.dlg input{width:100%;margin-bottom:12px}
.dlg .fila{justify-content:flex-end}
.btn.rojo{background:var(--crit);border-color:var(--crit);color:#fff}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(10px);background:#0d2447;color:#fff;padding:11px 18px;border-radius:12px;font-size:14px;z-index:99;opacity:0;transition:all .2s;pointer-events:none;max-width:90vw;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.toast.on{opacity:1;transform:translateX(-50%)}
.oculto{display:none!important}
@media (max-width:1100px){.filtros{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}.filtros input{grid-column:1/-1}}
@media (max-width:900px){
  .login{grid-template-columns:1fr}
  .login-brand{padding:28px 22px}
  .login-brand h1{font-size:26px;margin-top:18px}
  .login-brand ul{display:none}
  .shell{grid-template-columns:1fr}
  .side{position:fixed;left:0;top:0;bottom:0;width:270px;transform:translateX(-100%);transition:transform .2s}
  .side.abierto{transform:none}
  .scrim.on{display:block;position:fixed;inset:0;background:rgba(13,36,71,.45);z-index:55}
  .btn.menuBtn{display:inline-flex}
  .topbar{padding:12px 14px}
  .topbar h1{font-size:18px}
  .topbar .acc{display:none}
  .content{padding:4px 12px 32px}
  .card{padding:14px}
  .hero{padding:20px}
  .hero h2{font-size:20px}
  .g2{grid-template-columns:1fr}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .kpi{padding:12px;gap:10px}
  .kpi .ico{width:34px;height:34px}
  .kpi b{font-size:22px}
  .gridRep{grid-template-columns:1fr}
  .gridRep>.card:first-child{position:static}
  table.t.resp thead{display:none}
  table.t.resp tr{display:block;border:1px solid var(--borde);border-radius:12px;margin-bottom:10px;background:#fff;padding:6px 0}
  table.t.resp td{display:flex;justify-content:space-between;gap:10px;border:0;padding:5px 12px;text-align:right}
  table.t.resp td::before{content:attr(data-l);color:var(--suave);font-size:12px;text-align:left;flex-shrink:0}
  table.t.resp td .avance{min-width:0;flex:1;max-width:60%}
  .overlay{padding:0}
  .modal{border-radius:0;min-height:100vh}
  .modal .mhead{border-radius:0}
}
#zonaImpresion{display:none}
@media print{
  body.imprimir #raiz,body.imprimir .toast,body.imprimir #fichaCont{display:none!important}
  body.imprimir #zonaImpresion{display:block!important}
}
</style>
</head>
<body>
<div id="raiz"></div>
<div id="fichaCont"></div>
<div id="zonaImpresion"></div>
<div id="dlgCont"></div>
<div class="toast" id="toast" role="status"></div>
<input type="file" id="fileXlsx" accept=".xlsx,.xlsm,.xls" multiple class="oculto">
<input type="file" id="fileJson" accept=".json,application/json" class="oculto">

<script>
'use strict';
/* =========================================================================
   Calificador de postulantes VIBA
   Todo se procesa en este navegador. No hay llamadas de red (CSP connect-src 'none').
   Los datos se guardan cifrados (AES-GCM) con una clave que solo se abre con
   la contraseña de un usuario registrado en este navegador.
   ========================================================================= */

const CLAVE = 'viba_calificador_v2';
const CLAVE_V1 = 'viba_calificador_v1';
const NCOL = 35;                            // A..AI
const IDX_CASILLAS = [21,22,23,24,25,26];   // V..AA
const IDX_MARCAS   = [29,30,31,32,33,34];   // AD..AI
const LETRAS = Array.from({length:NCOL},(_,i)=>i<26?String.fromCharCode(65+i):'A'+String.fromCharCode(65+i-26));
const ENC_DEF = ['Nº','DNI','APELLIDO PATERNO','APELLIDO MATERNO','NOMBRES','DIRECCIÓN','MZ','LT','SUB LOTE','DISTRITO','MEDIDAS DEL PREDIO','MÓDULO','ÁREA A CONSTRUIR (M2)','CARGA FAMILIAR','DNI CARGA FAMILIAR','CELULAR','OBSERVACIONES','AHORRO','PRE-AHORRO','LATITUD (X)','LONGITUD (Y)','LICENCIA','CONSTATACIÓN','PU Y HR','PLANOS','CONTRATO','CARTA FIANZA','AB','AC','LICENCIA','CONSTATACIÓN','PU Y HR','PLANOS','CONTRATOS','CARTA FIANZA'];
const EST = {CITA:'SOLICITAR CITA', FALTAN:'FALTAN DOCUMENTOS', SIN:'SIN INICIAR', NO:'NO CALIFICA'};
const EST_ORDEN = [EST.CITA, EST.FALTAN, EST.SIN, EST.NO];
const HEX = {ok:'#0ca30c', warn:'#fab219', neutro:'#9aa3ae', crit:'#d03b3b', azul:'#2563b0', azulOsc:'#16427a', texto:'#1c2533', suave:'#5d6b7e', pista:'#eef1f5', grid:'#e6eaf0'};
const EST_COLOR = {[EST.CITA]:HEX.ok, [EST.FALTAN]:HEX.warn, [EST.SIN]:HEX.neutro, [EST.NO]:HEX.crit};
const RESULTADOS = ['Apta','No apta','Observada'];
const VISITA_OPC = ['Apta','Observada','No apta','Registrada sin resultado','Sin visita'];
const DISTRITOS = [['VENTANILLA','Ventanilla'],['PUENTE PIEDRA','Puente Piedra'],['HUACHO','Huacho'],['VEGUETA','Végueta'],['HUAURA','Huaura']];
const INACTIVIDAD_MIN = 20;

const CONFIG_DEF = {
  areaMin: 35,
  grupos: [
    {monto:2475, etiqueta:'Grupo Lima Norte', sinCasillasWY:false},
    {monto:3500, etiqueta:'Grupo Norte Chico', sinCasillasWY:true}
  ],
  requisitos: ['Licencia','Constatación','PU y HR','Planos','Contratos','Carta fianza'],
  vivienda: [],
  tplFaltan: 'Hola {NOMBRE}, le saluda VIBA Grupo Inmobiliario. Para continuar con su postulación necesitamos los siguientes documentos: {FALTANTES}. Puede enviarlos por este medio o responder este mensaje si tiene alguna consulta. ¡Gracias!',
  tplCita: 'Hola {NOMBRE}, le saluda VIBA Grupo Inmobiliario. Su expediente está completo y la visita a su predio fue aprobada. Queremos coordinar una cita con usted. ¿Qué día y hora le acomoda?',
  correoPara: '',
  correoFirma: 'Equipo de Proyectos · VIBA Grupo Inmobiliario'
};

/* ---------------- utilidades ---------------- */
const $ = (s,r=document)=>r.querySelector(s);
const esc = s=>String(s ?? '').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function lev(a,b){

const CRC_T=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0;}return t;})();

function crearZip(archivos){
  const partes=[],central=[];let off=0;
  for(const f of archivos){
    const nm=te.encode(f.name),d=f.data,crc=crc32(d);
    const h=new DataView(new ArrayBuffer(30));
    h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(6,0x0800,true);h.setUint16(12,0x21,true);
    h.setUint32(14,crc,true);h.setUint32(18,d.length,true);h.setUint32(22,d.length,true);h.setUint16(26,nm.length,true);
    partes.push(new Uint8Array(h.buffer),nm,d);
    const c=new DataView(new ArrayBuffer(46));
    c.setUint32(0,0x02014b50,true);c.setUint16(4,20,true);c.setUint16(6,20,true);c.setUint16(8,0x0800,true);c.setUint16(14,0x21,true);
    c.setUint32(16,crc,true);c.setUint32(20,d.length,true);c.setUint32(24,d.length,true);c.setUint16(28,nm.length,true);c.setUint32(42,off,true);
    central.push(new Uint8Array(c.buffer),nm);
    off+=30+nm.length+d.length;
  }
  const tam=central.reduce((a,b)=>a+b.length,0), e=new DataView(new ArrayBuffer(22));
  e.setUint32(0,0x06054b50,true);e.setUint16(8,archivos.length,true);e.setUint16(10,archivos.length,true);e.setUint32(12,tam,true);e.setUint32(16,off,true);
  return new Blob([...partes,...central,new Uint8Array(e.buffer)],{type:'application/zip'});
}

async function derivar(pass,salt,iter){
  const base=await crypto.subtle.importKey('raw',te.encode(pass),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
}
async function cifrar(key,bytes){const iv=crypto.getRandomValues(new Uint8Array(12));const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,bytes);return {iv:b64(iv),ct:b64(ct)};}

async function envolver(pass,raw){
  const salt=crypto.getRandomValues(new Uint8Array(16)), iter=310000;
  const k=await derivar(pass,salt,iter);
  return {salt:b64(salt),iter,w:await cifrar(k,raw)};
}

function normDni(v){
  if(v==null||v==='') return {dni:'',orig:'',digitos:false};
  const orig = typeof v==='number' ? String(Math.round(v)) : txt(v);
  const dig = orig.replace(/\D/g,'');
  if(!dig) return {dni:'',orig,digitos:false};
  const dni = dig.length<8 ? dig.padStart(8,'0') : dig;
  return {dni, orig, digitos:true, corregido: dni!==orig, invalido: dig.length>8, corto: dig.length<6};
}
function parseCel(v){
  if(v==null||v==='') return [];
  const s = typeof v==='number' ? String(Math.round(v)) : String(v);
  const out=[];
  for(const pt of s.split(/[\/,;|\n]+|\s+[yYoO]\s+|\s+-\s+/)){
    let d=pt.replace(/\D/g,'');
    if(!d) continue;
    if(d.length===11 && d.startsWith('51')) d=d.slice(2);
    const valido=/^9\d{8}$/.test(d);
    out.push({num:d, valido, motivo: valido?'':(d.length!==9?`tiene ${d.length} dígitos`:'no empieza con 9')});
  }
  return out;
}
function normDistrito(v){
  const t=txt(v);
  if(!t) return {estado:'vacio', valor:'', sugerido:''};
  const n=norm(t).replace(/[^A-Z ]/g,' ').replace(/\s+/g,' ').trim();
  for(const [k,c] of DISTRITOS) if(n===k) return {estado:'ok', valor:c, sugerido:''};
  const inc=DISTRITOS.filter(([k])=>new RegExp('(^| )'+k+'( |$)').test(n));
  if(inc.length===1) return {estado:'ok', valor:inc[0][1], sugerido:''};
  let mejor='',bd=99;
  for(const [k,c] of DISTRITOS){const d=lev(n,k); if(d<bd){bd=d;mejor=c;}}

}
function utmALatLng(E,N,zona,sur){
  const a=6378137,f=1/298.257223563,k0=0.9996,e2=f*(2-f),ep2=e2/(1-e2);

  return [lat*180/Math.PI,lng*180/Math.PI];
}
function parseCoord(x,y){

  if(a==null||b==null) return {ok:false,motivo:'Coordenada incompleta'};
  let lat=a,lng=b,nota='';
  if(Math.abs(a)>1000&&Math.abs(b)>1000){[lat,lng]=utmALatLng(Math.min(a,b),Math.max(a,b),18,true);nota='Convertida desde UTM zona 18S';}

}

function leerLibro(wb){
  const avisos=[];
  const hoja=wb.SheetNames.find(n=>norm(n)==='TEST DOCUMENTARIO');
  if(!hoja) throw new Error('No se encontró la hoja "TEST DOCUMENTARIO". Hojas del archivo: '+wb.SheetNames.join(', '));
  const ws=wb.Sheets[hoja];
  if(!ws['!ref']) throw new Error('La hoja "TEST DOCUMENTARIO" está vacía.');
  const rg=XLSX.utils.decode_range(ws['!ref']);
  const val=(r,c)=>{
    const cell=ws[XLSX.utils.encode_cell({r,c})];
    if(!cell||cell.t==='e'||cell.t==='z'||cell.v==null) return null;
    if(typeof cell.v==='string'){const s=cell.v.trim(); return s===''?null:s;}
    return cell.v;
  };
  const titulo=val(0,4);
  if(!titulo||!norm(titulo).includes('DOCUMENTOS PARA INGRESO')) avisos.push('La celda E1 no tiene el título esperado ("DOCUMENTOS PARA INGRESO DE PROYECTOS…"). Verifique que sea el archivo correcto.');
  const encabezados=[];
  for(let c=0;c<NCOL;c++){const h=val(2,c); encabezados.push(h==null?'':txt(h));}
  if(!norm(encabezados[1]).includes('DNI')) avisos.push('La celda B3 no dice "DNI": revise que los encabezados estén en la fila 3.');
  const filas=[];
  for(let r=3;r<=rg.e.r;r++){
    const c=[];let alguno=false;
    for(let k=0;k<NCOL;k++){const v=val(r,k);c.push(v);if(v!=null)alguno=true;}
    if(alguno) filas.push({fila:r+1,c});
  }
  return {hoja,titulo:titulo==null?'':txt(titulo),encabezados,filas,avisos};
}
function procesar(filas){
  const post=[],descartes=[];let vacias=0;
  for(const f of filas){
    const c=f.c;
    const tieneDatos=c.slice(2,21).some(v=>v!=null);
    if(c[1]==null){
      if(tieneDatos) descartes.push({fila:f.fila,motivo:'Sin DNI en la columna B',detalle:[c[2],c[3],c[4]].filter(Boolean).join(' ')});
      else vacias++;

    const d=normDni(c[1]);
    if(!d.digitos){descartes.push({fila:f.fila,motivo:'La columna B no contiene un DNI',detalle:txt(c[1])});continue;}
    post.push(crearPostulante(f,d));

    coordOrig:[txt(c[19]),txt(c[20])], coord:parseCoord(c[19],c[20]),
    casillas:IDX_CASILLAS.map(i=>casilla(c[i])),
    marcas:IDX_MARCAS.map(i=>marca(c[i])),
    marcasRaw:IDX_MARCAS.map(i=>txt(c[i])),
    reqManual:[null,null,null,null,null,null],

}

/* ---------------- reglas de calificación ---------------- */
const nombreCompleto = p=>[p.apPat,p.apMat].filter(Boolean).join(' ')+(p.nombres?', '+p.nombres:'');
const distritoDe = p=>p.distritoManual || p.distrito.valor || '';
const distritoRevisar = p=>!p.distritoManual && p.distrito.estado!=='ok';
function grupoDe(p,cfg=S.config){
  if(p.ahorro==null) return null;
  return cfg.grupos.find(g=>Math.abs(Number(g.monto)-p.ahorro)<0.005)||null;
}
const etiquetaGrupo = p=>grupoDe(p)?.etiqueta || 'Sin grupo';
function reqArchivo(p,cfg=S.config){
  const g=grupoDe(p,cfg);
  return [0,1,2,3,4,5].map(i=>{
    let cas=p.casillas[i];
    if(g&&g.sinCasillasWY&&(i===1||i===3)) cas=null;   // W y Y no existen en este grupo
    const m=p.marcas[i];
    if(cas===true||m==='X') return 'CUMPLE';
    if(m==='FALTA') return 'FALTA';
    return 'PENDIENTE';
  });
}
function hayVisita(v){return !!(v&&(v.resultado||v.fecha));}
function evaluar(p,opts={}){
  const cfg=opts.cfg||S.config;
  const base=reqArchivo(p,cfg);
  const reqs=opts.soloArchivo?base:base.map((v,i)=>p.reqManual[i]||v);
  const v=opts.soloArchivo?visitaVacia():p.visita;
  const cumple=reqs.filter(r=>r==='CUMPLE').length;
  const faltanIdx=reqs.map((r,i)=>r==='CUMPLE'?-1:i).filter(i=>i>=0);
  const faltan=faltanIdx.map(i=>cfg.requisitos[i]);
  const area=num(v.areaConstruir);
  let estado,motivo;
  if(v.resultado==='No apta'){estado=EST.NO;motivo='Visita de constatación: No apta'+(v.obs?' ('+v.obs+')':'');}
  else if(area!=null&&area<Number(cfg.areaMin)){estado=EST.NO;motivo=`Área a construir ${area} m² es menor que el mínimo de ${cfg.areaMin} m²`;}
  else if(reqs.every(r=>r==='PENDIENTE')&&!hayVisita(v)){estado=EST.SIN;motivo='Ningún requisito marcado y sin visita registrada';}
  else if(cumple===6&&v.resultado==='Apta'){estado=EST.CITA;motivo='6 de 6 requisitos y visita Apta';}
  else{
    estado=EST.FALTAN;
    const vis=v.resultado?`visita ${v.resultado}`:(hayVisita(v)?'visita sin resultado':'sin visita');
    motivo=faltan.length?'Faltan: '+faltan.join(', '):`Documentos completos. Falta: visita Apta (${vis})`;
  }
  return {reqs,cumple,pct:cumple/6,faltan,faltanIdx,estado,motivo,resultado:v.resultado||(hayVisita(v)?'Registrada sin resultado':'Sin visita')};
}
const todos = ()=>S.post.map(p=>({p,e:evaluar(p)}));

/* =========================================================================
   Datos acumulados en el tiempo: varias cargas de Excel + cambios hechos en la app
   S = {v:2, config, cargas:[...], overlay:{clave:{reqManual,visita,distritoManual,historial}}, cortes:[...]}
   S.post y S.datos se derivan de las cargas (no se guardan).
   ========================================================================= */
const nuevoId = p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const estadoVacio = ()=>({v:2,config:clon(CONFIG_DEF),cargas:[],overlay:{},cortes:[],post:[],datos:null});
function migrar(d){
  if(d&&d.v===2&&Array.isArray(d.cargas)){const n=Object.assign(estadoVacio(),d);n.config=Object.assign(clon(CONFIG_DEF),d.config||{});n.overlay=n.overlay||{};n.cortes=n.cortes||[];return n;}
  const n=estadoVacio();
  if(!d) return n;
  n.config=Object.assign(clon(CONFIG_DEF),d.config||{});
  if(d.datos&&Array.isArray(d.datos.filas)){
    n.cargas.push({id:nuevoId('c'),etiqueta:'Carga inicial',...d.datos,nuevos:(d.post||[]).length,cambios:0});
    const occ={};
    for(const p of d.post||[]){const k=p.dni+'#'+(occ[p.dni]=(occ[p.dni]||0)+1);n.overlay[k]={reqManual:p.reqManual||[null,null,null,null,null,null],visita:p.visita||visitaVacia(),distritoManual:p.distritoManual||null,historial:p.historial||[]};}
  }
  return n;
}
function cargarEstado(d){S=migrar(d);consolidar();}
function serializar(){const {post,datos,...resto}=S;return JSON.stringify(resto);}
function enlazar(p){
  const ov=S.overlay[p.key]||(S.overlay[p.key]={reqManual:[null,null,null,null,null,null],visita:visitaVacia(),distritoManual:null,historial:[]});
  for(const f of ['reqManual','visita','distritoManual','historial']) Object.defineProperty(p,f,{get:()=>ov[f],set:v=>{ov[f]=v;},enumerable:true,configurable:true});
}
// Une todas las cargas: la carga más reciente manda para los datos del archivo; lo registrado en la app se conserva.
function consolidar(){
  const mapa=new Map(), orden=[];
  for(const c of S.cargas){
    const occ={};
    for(const p of procesar(c.filas).post){
      const k=p.dni+'#'+(occ[p.dni]=(occ[p.dni]||0)+1);
      p.key=k; p.id=k; p.cargaId=c.id; p.archivo=c.archivo; p.etiquetaCarga=c.etiqueta;
      if(!mapa.has(k)) orden.push(k);
      mapa.set(k,p);
    }
  }
  S.post=orden.map((k,i)=>{const p=mapa.get(k);p.orden=i;enlazar(p);return p;});
  S.datos=S.cargas.length?S.cargas[S.cargas.length-1]:null;
}
const cargaDe = p=>S.cargas.find(c=>c.id===p.cargaId)||S.datos;
function fechaLocal(iso){const d=new Date(iso);return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);}

/* ---------------- cortes: fotos del avance para ver la evolución ---------------- */
function foto(){
  const L=todos(), N=L.length, porEst=Object.fromEntries(EST_ORDEN.map(s=>[s,0])), mapa={};
  L.forEach(({p,e})=>{porEst[e.estado]++;mapa[p.key]=[e.cumple,EST_ORDEN.indexOf(e.estado)];});
  return {N,porEst,prom:N?L.reduce((a,x)=>a+x.e.pct,0)/N:0,reqCumple:[0,1,2,3,4,5].map(i=>L.filter(x=>x.e.reqs[i]==='CUMPLE').length),mapa};
}
function crearCorte(motivo){S.cortes.push({id:nuevoId('k'),fecha:new Date().toISOString(),motivo,u:AUTH?AUTH.nombre:'',...foto()});}
// Una vez al día, al ingresar, se guarda un corte si algo cambió desde el último.
function corteAutomatico(){
  if(!S.post.length) return;
  const ult=S.cortes[S.cortes.length-1];
  if(ult&&fechaLocal(ult.fecha)===hoyISO()) return;
  const f=foto();
  if(ult&&JSON.stringify(ult.mapa)===JSON.stringify(f.mapa)) return;
  S.cortes.push({id:nuevoId('k'),fecha:new Date().toISOString(),motivo:'Corte automático del día',u:AUTH?AUTH.nombre:'',...f});
  guardar();
}

/* =========================================================================
   Gráficas: SVG con colores literales, para la pantalla y para el correo
   ========================================================================= */
const f2 = n=>+n.toFixed(2);
function svgWrap(w,h,body,titulo){
  return `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="${esc(titulo)}"><rect width="${w}" height="${h}" fill="#ffffff"/>${body}</svg>`;
}
const corta = (s,n)=>s.length>n?s.slice(0,n-1)+'…':s;
function grDona(items,titulo){
  const w=640,h=250,cx=125,cy=125,R=104,r=68,tot=items.reduce((a,x)=>a+x.n,0);
  const pt=(a,rad)=>[f2(cx+rad*Math.cos(a)),f2(cy+rad*Math.sin(a))];
  let body='',ang=-Math.PI/2;
  if(!tot) body+=`<circle cx="${cx}" cy="${cy}" r="${(R+r)/2}" fill="none" stroke="${HEX.pista}" stroke-width="${R-r}"/>`;
  for(const it of items){
    if(!it.n) continue;
    const a2=ang+it.n/tot*2*Math.PI, tt=`<title>${esc(it.label)}: ${it.n} (${pct(it.n/tot)})</title>`;
    if(it.n===tot) body+=`<g ${it.act||''}><circle class="mk" cx="${cx}" cy="${cy}" r="${(R+r)/2}" fill="none" stroke="${it.color}" stroke-width="${R-r}">${tt}</circle></g>`;
    else{
      const lg=a2-ang>Math.PI?1:0,[x1,y1]=pt(ang,R),[x2,y2]=pt(a2,R),[x3,y3]=pt(a2,r),[x4,y4]=pt(ang,r);
      body+=`<g ${it.act||''}><path class="mk" d="M${x1} ${y1}A${R} ${R} 0 ${lg} 1 ${x2} ${y2}L${x3} ${y3}A${r} ${r} 0 ${lg} 0 ${x4} ${y4}Z" fill="${it.color}" stroke="#ffffff" stroke-width="2">${tt}</path></g>`;
    }
    ang=a2;
  }
  body+=`<text x="${cx}" y="${cy+4}" text-anchor="middle" font-size="34" font-weight="700" fill="${HEX.texto}">${tot}</text><text x="${cx}" y="${cy+26}" text-anchor="middle" font-size="13" fill="${HEX.suave}">postulantes</text>`;
  const y0=cy-items.length*46/2+10;
  items.forEach((it,i)=>{
    const y=y0+i*46;
    body+=`<g ${it.act||''}><rect x="272" y="${y-4}" width="352" height="42" fill="#ffffff" fill-opacity="0"/><rect x="276" y="${y+2}" width="14" height="14" rx="4" fill="${it.color}"/>`+
      `<text x="300" y="${y+14}" font-size="15" font-weight="700" fill="${HEX.texto}">${esc(it.label)}</text>`+
      `<text x="300" y="${y+32}" font-size="13" fill="${HEX.suave}">${it.n} postulantes · ${tot?pct(it.n/tot):'0%'}</text></g>`;
  });
  return {svg:svgWrap(w,h,body,titulo),w,h};
}
function grBarrasH(rows,{leyenda=null,titulo='',lw=200,max=null}={}){
  const w=640,rw=46,top=leyenda?36:10,rh=36,bh=18,h=top+rows.length*rh+6,bw=w-lw-rw-8;
  const mx=max||Math.max(1,...rows.map(r=>r.parts.reduce((a,p)=>a+p.n,0)));
  let body='';
  if(leyenda){let x=lw;leyenda.forEach(l=>{body+=`<rect x="${x}" y="8" width="12" height="12" rx="3" fill="${l.color}"/><text x="${x+18}" y="18" font-size="13" fill="${HEX.texto}">${esc(l.name)}</text>`;x+=30+l.name.length*7.2;});}
  rows.forEach((r,i)=>{
    const y=top+i*rh, tot=r.parts.reduce((a,p)=>a+p.n,0);
    body+=`<g ${r.act||''}><rect x="0" y="${y-8}" width="${w}" height="${rh}" fill="#ffffff" fill-opacity="0"/>`;
    body+=`<text x="${lw-12}" y="${y+bh/2+5}" text-anchor="end" font-size="13" fill="${HEX.texto}">${esc(corta(r.label,30))}</text>`;
    body+=`<rect x="${lw}" y="${y}" width="${bw}" height="${bh}" rx="4" fill="${HEX.pista}"/>`;
    let x=lw; const nz=r.parts.filter(p=>p.n>0);
    nz.forEach((p,k)=>{const ww=p.n/mx*bw, gap=k<nz.length-1?2:0; if(ww-gap>0.5) body+=`<rect class="mk" x="${f2(x)}" y="${y}" width="${f2(ww-gap)}" height="${bh}" rx="4" fill="${p.color}"><title>${esc(r.label)} · ${esc(p.name||'')}: ${p.n}</title></rect>`; x+=ww;});
    body+=`<text x="${w-4}" y="${y+bh/2+5}" text-anchor="end" font-size="13" font-weight="700" fill="${HEX.texto}">${tot}</text></g>`;
  });
  return {svg:svgWrap(w,h,body,titulo),w,h};
}
function grColumnas(items,color,titulo){
  const w=640,h=250,l=40,b=40,t=24,r=10,ph=h-t-b,pw=w-l-r;
  const mx=Math.max(1,...items.map(i=>i.n)), paso=Math.max(1,Math.ceil(mx/4)), top=paso*4;
  let body='';
  for(let k=0;k<=4;k++){const y=f2(t+ph-k/4*ph);body+=`<line x1="${l}" x2="${w-r}" y1="${y}" y2="${y}" stroke="${HEX.grid}" stroke-width="1"/><text x="${l-8}" y="${y+4}" text-anchor="end" font-size="11" fill="${HEX.suave}">${paso*k}</text>`;}
  const slot=pw/items.length,bw=Math.min(56,slot*0.62);
  items.forEach((it,i)=>{
    const x=f2(l+i*slot+(slot-bw)/2),hh=f2(it.n/top*ph),y=f2(t+ph-hh);
    body+=`<g ${it.act||''}><rect x="${f2(l+i*slot)}" y="${t}" width="${f2(slot)}" height="${ph}" fill="#ffffff" fill-opacity="0"/>`;
    if(it.n) body+=`<rect class="mk" x="${x}" y="${y}" width="${f2(bw)}" height="${hh}" rx="4" fill="${color}"><title>${esc(it.label)}: ${it.n}</title></rect>`;
    body+=`<text x="${f2(x+bw/2)}" y="${f2(y-7)}" text-anchor="middle" font-size="13" font-weight="700" fill="${HEX.texto}">${it.n}</text>`;
    body+=`<text x="${f2(x+bw/2)}" y="${h-b+20}" text-anchor="middle" font-size="12" fill="${HEX.suave}">${esc(it.label)}</text></g>`;
  });
  body+=`<line x1="${l}" x2="${w-r}" y1="${t+ph}" y2="${t+ph}" stroke="#c9d1dc" stroke-width="1"/>`;
  return {svg:svgWrap(w,h,body,titulo),w,h};
}
function svgAPng({svg,w,h},escala=2){
  return new Promise((res,rej)=>{
    const img=new Image();
    img.onload=()=>{const c=document.createElement('canvas');c.width=w*escala;c.height=h*escala;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);try{res(c.toDataURL('image/png'));}catch(e){rej(e);}};
    img.onerror=()=>rej(new Error('No se pudo convertir la gráfica a imagen'));
    img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);
  });
}

/* ---------------- métricas compartidas (inicio + reporte) ---------------- */
const act = (campo,valor)=>`data-act="filtrar" data-campo="${esc(campo)}" data-valor="${esc(valor)}"`;
function metricas(L,conAcciones=false){
  const N=L.length, R=S.config.requisitos;
  const porEst=Object.fromEntries(EST_ORDEN.map(s=>[s,0])); L.forEach(x=>porEst[x.e.estado]++);
  const prom=N?L.reduce((a,x)=>a+x.e.pct,0)/N:0;
  const grupos={}; L.forEach(({p,e})=>{const g=etiquetaGrupo(p);const o=grupos[g]=grupos[g]||{n:0,suma:0,est:Object.fromEntries(EST_ORDEN.map(s=>[s,0])),d:{}};o.n++;o.suma+=e.pct;o.est[e.estado]++;const d=distritoDe(p)||'(sin distrito)';o.d[d]=(o.d[d]||0)+1;});
  const cuello=R.map((r,i)=>({r,i,falta:L.filter(x=>x.e.reqs[i]==='FALTA').length,pend:L.filter(x=>x.e.reqs[i]==='PENDIENTE').length})).sort((a,b)=>(b.falta+b.pend)-(a.falta+a.pend)||a.i-b.i);
  const dist=[0,0,0,0,0,0,0]; L.forEach(x=>dist[x.e.cumple]++);
  const vis=Object.fromEntries(VISITA_OPC.map(k=>[k,0])); L.forEach(x=>vis[x.e.resultado]++);
  const A=a=>conAcciones?a:'';
  const charts={
    estados:grDona(EST_ORDEN.map(s=>({label:s,n:porEst[s],color:EST_COLOR[s],act:A(act('estado',s))})),'Postulantes por estado'),
    cuello:grBarrasH(cuello.map(c=>({label:c.r,act:A(act('falta',String(c.i))),parts:[{n:c.falta,color:HEX.crit,name:'FALTA'},{n:c.pend,color:HEX.neutro,name:'PENDIENTE'}]})),{leyenda:[{name:'En FALTA',color:HEX.crit},{name:'PENDIENTE',color:HEX.neutro}],titulo:'Postulantes a los que les falta cada requisito',max:Math.max(1,N)}),
    avance:grColumnas(dist.map((n,i)=>({label:`${i}/6`,n})),HEX.azul,'Distribución del avance documentario'),
    distritos:grBarrasH(Object.entries(grupos).flatMap(([g,o])=>Object.entries(o.d).sort((a,b)=>b[1]-a[1]).map(([d,n])=>({label:`${d} · ${g.replace(/^Grupo /,'')}`,act:A(act('distrito',d)),parts:[{n,color:HEX.azul,name:'Postulantes'}]}))),{titulo:'Postulantes por distrito',lw:230})
  };
  return {N,porEst,prom,grupos,cuello,dist,vis,charts};
}
function calidadResumen(P){
  const dup={}; P.forEach(p=>(dup[p.dni]=dup[p.dni]||[]).push(p));
  return {
    dniCorregidos:P.filter(p=>p.dniCorregido).length,
    dniDuplicados:Object.values(dup).filter(l=>l.length>1).length,
    sinCelular:P.filter(p=>!p.celulares.length).length,

}

async function enviarLogin(ev){
  ev.preventDefault();
  const msg=$('#loginMsg'), btn=ev.target.querySelector('button[type=submit]');
  const mostrar=(t,cls='error')=>{msg.innerHTML=`<div class="${cls}">${esc(t)}</div>`;};
  if(!window.crypto||!crypto.subtle){mostrar('Este navegador no permite el cifrado necesario. Use una versión reciente de Chrome, Edge, Firefox o Safari.');return;}
  btn.disabled=true;
  try{
    if(ev.target.id==='fSetup'){
      const nombre=txt($('#sNombre').value), u=normUsuario($('#sUsuario').value), p1=$('#sPass').value, p2=$('#sPass2').value;
      if(!nombre) throw new Error('Escriba su nombre.');
      if(!usuarioValido(u)) throw new Error('El usuario debe tener de 3 a 30 caracteres: letras, números, punto, guion o guion bajo.');
      if(p1.length<8) throw new Error('La contraseña debe tener al menos 8 caracteres.');
      if(p1!==p2) throw new Error('Las contraseñas no coinciden.');
      mostrar('Creando la cuenta…','okmsg');
      await crearAdmin(nombre,u,p1);
    }else{
      if(Date.now()<intentos.hasta) throw new Error(`Demasiados intentos. Espere ${Math.ceil((intentos.hasta-Date.now())/1000)} segundos.`);
      const u=normUsuario($('#lUsuario').value), p=$('#lPass').value;
      mostrar('Verificando…','okmsg');
      try{await ingresar(u,p);}catch(e){
        intentos.n++; if(intentos.n>=5){intentos.hasta=Date.now()+30000;intentos.n=0;}
        throw new Error(e.message==='cred'?'Usuario o contraseña incorrectos.':'No se pudieron abrir los datos guardados.');
      }
      intentos={n:0,hasta:0};
    }
    ultimaActividad=Date.now();
    try{seccion=localStorage.getItem(CLAVE+'_sec')||'inicio';}catch(e){seccion='inicio';}
    if(!puedeVer(seccion)) seccion='inicio';
    corteAutomatico();
    renderApp();
  }catch(err){mostrar(err.message);btn.disabled=false;}
}

/* ---------------- Postulantes ---------------- */
function filtrados(){
  const q=norm(F.q), qd=F.q.replace(/\D/g,'');
  let L=todos().filter(({p,e})=>{
    if(q){const nom=norm(nombreCompleto(p));if(!(nom.includes(q)||(qd&&p.dni.includes(qd))||q.split(' ').every(w=>nom.includes(w))))return false;}
    if(F.distrito&&distritoDe(p)!==F.distrito) return false;
    if(F.grupo&&etiquetaGrupo(p)!==F.grupo) return false;
    if(F.estado&&e.estado!==F.estado) return false;
    if(F.falta!==''&&!e.faltanIdx.includes(Number(F.falta))) return false;
    if(F.visita&&e.resultado!==F.visita) return false;
    return true;
  });
  if(F.orden==='desc') L.sort((a,b)=>b.e.pct-a.e.pct||a.p.orden-b.p.orden);
  else if(F.orden==='asc') L.sort((a,b)=>a.e.pct-b.e.pct||a.p.orden-b.p.orden);
  else L.sort((a,b)=>a.p.orden-b.p.orden);
  return L;
}

function leerFormVisita(p){
  const fv=$('#formVisita'), v=clon(p.visita);
  ['fecha','tecnico','resultado','medidas','areaTerreno','modulo','areaConstruir','lat','lng','obs'].forEach(n=>v[n]=fv.querySelector(`[name=${n}]`).value.trim());
  if(!v.tecnico&&(v.fecha||v.resultado)) v.tecnico=AUTH.nombre;
  v.vivienda={}; S.config.vivienda.forEach(r=>{const s=fv.querySelector(`[name="viv_${r.id}"]`); if(s&&s.value) v.vivienda[r.id]=s.value;});
  return v;
}
function guardarVisita(p){
  const nv=leerFormVisita(p), ov=p.visita;
  const et={fecha:'Fecha de visita',tecnico:'Técnico',resultado:'Resultado de visita',medidas:'Medidas',areaTerreno:'Área del terreno',modulo:'Módulo',areaConstruir:'Área a construir',lat:'Latitud',lng:'Longitud',obs:'Observaciones de visita'};
  for(const k of ['areaTerreno','areaConstruir','lat','lng']) if(nv[k]&&num(nv[k])==null){toast(`"${et[k]}" debe ser un número`);return;}
  if((nv.lat||nv.lng)&&!parseCoord(nv.lat,nv.lng).ok){toast('Las coordenadas no son válidas para el Perú');return;}
  const antes=evaluar(p).estado; let cambios=0;
  for(const k of Object.keys(et)) if((ov[k]||'')!==(nv[k]||'')){registrar(p,et[k],ov[k],nv[k]);cambios++;}
  for(const r of S.config.vivienda){const a=ov.vivienda?.[r.id]||'',b=nv.vivienda[r.id]||''; if(a!==b){registrar(p,'Vivienda · '+r.nombre,a,b);cambios++;}}
  p.visita=nv;
  const despues=evaluar(p).estado; if(antes!==despues) registrar(p,'Estado',antes,despues);
  guardar(); toast(cambios?'Visita guardada':'Sin cambios'); pintarFicha();
}

let RO={alcance:'todos',incluirLista:true,incluirContacto:false,comentario:''};
function datosReporte(){
  const L=RO.alcance==='filtro'?filtrados():todos();
  return {L,M:metricas(L,false),Q:calidadResumen(L.map(x=>x.p)),citas:L.filter(x=>x.e.estado===EST.CITA),casi:L.filter(x=>x.e.cumple===5&&x.e.estado!==EST.NO),fecha:new Date()};
}
function textoResumen(R){
  const M=R.M, top=M.cuello[0];
  let t=`De ${M.N} postulantes, ${M.porEst[EST.CITA]} están listos para solicitar cita, ${M.porEst[EST.FALTAN]} tienen documentos pendientes y ${M.porEst[EST.SIN]} aún no inician.`;
  if(M.porEst[EST.NO]) t+=` ${M.porEst[EST.NO]} no califican.`;
  t+=` El avance documentario promedio es ${pct(M.prom)}.`;
  if(top&&(top.falta+top.pend)) t+=` El requisito que más frena el avance es ${top.r} (falta en ${top.falta+top.pend} postulantes).`;
  return t;
}

const envolver76 = s=>s.replace(/.{1,76}/g,'$&\r\n');
const encabezadoUtf8 = s=>'=?UTF-8?B?'+b64(te.encode(s))+'?=';
async function descargarEml(){
  leerOpcionesReporte();
  const c=await prepararReporte();
  const cids=Object.fromEntries(Object.keys(c.png).map(k=>[k,k+'@viba']));
  const html=htmlCorreo(c.R,Object.fromEntries(Object.keys(cids).map(k=>[k,'cid:'+cids[k]])));
  const B='----=_VIBA_'+Math.random().toString(36).slice(2);
  const para=S.config.correoPara.split(/[;,]/).map(s=>s.trim()).filter(Boolean).join(', ');
  let eml=[
    'X-Unsent: 1',
    'To: '+para,
    'Subject: '+encabezadoUtf8(asuntoReporte(c.R)),
    'Date: '+new Date().toUTCString(),
    'MIME-Version: 1.0',
    `Content-Type: multipart/related; boundary="${B}"; type="text/html"`,
    '',
    `--${B}`,
    'Content-Type: text/html; charset=UTF-8',
    'Content-Transfer-Encoding: base64',
    '',
    envolver76(b64(te.encode(html)))
  ].join('\r\n');
  for(const [k,cid] of Object.entries(cids)){
    eml+=[`--${B}`,'Content-Type: image/png','Content-Transfer-Encoding: base64',`Content-ID: <${cid}>`,`Content-Disposition: inline; filename="${k}.png"`,'',envolver76(c.png[k].split(',')[1])].join('\r\n');
  }
  eml+=`--${B}--\r\n`;
  const nombre=`reporte_postulantes_${hoyISO()}`;
  const ok=EN_VISOR?await descargar(nombre+'.zip',crearZip([{name:nombre+'.eml',data:te.encode(eml)}])):await descargar(nombre+'.eml',eml,'message/rfc822');
  if(ok) toast(EN_VISOR?'Guardado: descomprima el .zip y abra el archivo .eml':'Correo descargado: ábralo, revíselo y pulse Enviar');
}
async function copiarReporte(){
  leerOpcionesReporte();
  const c=await prepararReporte();
  const plano=asuntoReporte(c.R)+'\n\n'+textoResumen(c.R);
  try{
    await navigator.clipboard.write([new ClipboardItem({'text/html':new Blob([c.html],{type:'text/html'}),'text/plain':new Blob([plano],{type:'text/plain'})})]);
    toast('Copiado. Péguelo en un correo nuevo (Ctrl+V)');
  }catch(e){
    const prev=$('#rPrev'); const r=document.createRange(); r.selectNodeContents(prev); const s=getSelection(); s.removeAllRanges(); s.addRange(r);
    const ok=document.execCommand('copy'); s.removeAllRanges();
    toast(ok?'Copiado. Péguelo en un correo nuevo':'No se pudo copiar: use "Descargar correo (.eml)"');
  }
}

async function leerArchivos(files){
  const errores=[];
  for(const file of files){
    try{
      if(!window.XLSX) throw new Error('La librería SheetJS no está disponible.');
      const wb=XLSX.read(await file.arrayBuffer(),{type:'array'});
      const lib=leerLibro(wb), res=procesar(lib.filas);
      pendientes.push({archivo:file.name,etiqueta:file.name.replace(/\.[^.]+$/,''),...lib,...res});
    }catch(err){errores.push(`${file.name}: ${err.message}`);}
  }
  renderImportar();
  if(errores.length){const msg=$('#importMsg'); if(msg) msg.innerHTML=errores.map(e=>`<div class="error">No se pudo leer ${esc(e)}</div>`).join('');}
}

  if(!pendientes.length) return;

  const antes=new Map(S.post.map(p=>{const e=evaluar(p);return [p.key,{req:reqArchivo(p),estado:e.estado,cumple:e.cumple}];}));
  const ids=[];
  for(const P of pendientes){
    const c={id:nuevoId('c'),etiqueta:P.etiqueta,archivo:P.archivo,fecha:new Date().toISOString(),hoja:P.hoja,titulo:P.titulo,encabezados:P.encabezados,filas:P.filas,descartes:P.descartes,vacias:P.vacias,nuevos:0,cambios:0};
    S.cargas.push(c); ids.push(c.id);
  }
  consolidar();
  const R={etiquetas:pendientes.map(P=>P.etiqueta).join(', '),nuevos:[],cambiaron:[],sinCambio:0};
  for(const p of S.post){
    if(!ids.includes(p.cargaId)) continue;
    const c=cargaDe(p), a=antes.get(p.key), req=reqArchivo(p);
    if(!a){registrar(p,'Archivo','',`Agregado desde "${c.etiqueta}" (fila ${p.fila})`);c.nuevos++;R.nuevos.push({p,e:evaluar(p)});continue;}
    let cambios=0;
    req.forEach((r,i)=>{if(r!==a.req[i]){cambios++;registrar(p,`${S.config.requisitos[i]} según "${c.etiqueta}"`,a.req[i],r);if(p.reqManual[i]){registrar(p,'Edición manual de '+S.config.requisitos[i],p.reqManual[i],'reemplazada por el archivo');p.reqManual[i]=null;}}});
    const e=evaluar(p);
    if(e.estado!==a.estado) registrar(p,'Estado',a.estado,e.estado);
    if(cambios){c.cambios++;R.cambiaron.push({p,e,d:e.cumple-a.cumple});} else R.sinCambio++;
  }
  crearCorte('Carga: '+R.etiquetas);
  pendientes=[]; resultadosPruebas=null; reporteCache=null; ultimoResultado=R;
  guardar(); toast(`Listo: ${R.nuevos.length} nuevos, ${R.cambiaron.length} con cambios`);
  renderApp();
}

const etiquetaCorte = k=>new Date(k.fecha).toLocaleDateString('es-PE',{day:'2-digit',month:'2-digit'});
function grLinea(pts,color,titulo){
  const w=640,h=250,l=44,b=40,t=28,r=24,ph=h-t-b,pw=w-l-r;
  const mx=Math.max(0.1,...pts.map(p=>p.v)), top=Math.min(1,Math.ceil(mx*10+0.5)/10);
  const X=i=>pts.length===1?l+pw/2:l+i*pw/(pts.length-1), Y=v=>t+ph-v/top*ph;
  let body='';
  for(let k=0;k<=4;k++){const v=top*k/4,y=f2(Y(v));body+=`<line x1="${l}" x2="${w-r}" y1="${y}" y2="${y}" stroke="${HEX.grid}" stroke-width="1"/><text x="${l-8}" y="${y+4}" text-anchor="end" font-size="11" fill="${HEX.suave}">${pct(v)}</text>`;}
  const paso=Math.max(1,Math.ceil(pts.length/8));
  pts.forEach((p,i)=>{if(i%paso===0||i===pts.length-1) body+=`<text x="${f2(X(i))}" y="${h-b+20}" text-anchor="middle" font-size="12" fill="${HEX.suave}">${esc(p.label)}</text>`;});
  if(pts.length>1){
    const d=pts.map((p,i)=>`${i?'L':'M'}${f2(X(i))} ${f2(Y(p.v))}`).join('');
    body+=`<path d="${d}L${f2(X(pts.length-1))} ${t+ph}L${f2(X(0))} ${t+ph}Z" fill="${color}" fill-opacity="0.10"/><path d="${d}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round"/>`;
  }
  pts.forEach((p,i)=>{body+=`<circle class="mk" cx="${f2(X(i))}" cy="${f2(Y(p.v))}" r="${i===pts.length-1?5:3.5}" fill="${color}" stroke="#ffffff" stroke-width="2"><title>${esc(p.label)}: ${pct(p.v)}</title></circle>`;});
  const u=pts[pts.length-1]; if(u) body+=`<text x="${f2(Math.min(X(pts.length-1),w-r))}" y="${f2(Y(u.v)-12)}" text-anchor="${pts.length>1?'end':'middle'}" font-size="13" font-weight="700" fill="${HEX.texto}">${pct(u.v)}</text>`;
  body+=`<line x1="${l}" x2="${w-r}" y1="${t+ph}" y2="${t+ph}" stroke="#c9d1dc" stroke-width="1"/>`;
  return {svg:svgWrap(w,h,body,titulo),w,h};
}
function grApiladas(items,leyenda,titulo){
  const w=640,h=270,l=40,b=40,t=40,r=10,ph=h-t-b,pw=w-l-r;
  const mx=Math.max(1,...items.map(i=>i.parts.reduce((a,p)=>a+p.n,0))), paso=Math.max(1,Math.ceil(mx/4)), top=paso*4;
  let body='',x0=l;
  leyenda.forEach(g=>{body+=`<rect x="${x0}" y="8" width="12" height="12" rx="3" fill="${g.color}"/><text x="${x0+18}" y="18" font-size="12" fill="${HEX.texto}">${esc(g.name)}</text>`;x0+=30+g.name.length*8;});
  for(let k=0;k<=4;k++){const y=f2(t+ph-k/4*ph);body+=`<line x1="${l}" x2="${w-r}" y1="${y}" y2="${y}" stroke="${HEX.grid}" stroke-width="1"/><text x="${l-8}" y="${y+4}" text-anchor="end" font-size="11" fill="${HEX.suave}">${paso*k}</text>`;}
  const slot=pw/items.length,bw=Math.min(44,slot*0.6),pasoX=Math.max(1,Math.ceil(items.length/10));
  items.forEach((it,i)=>{
    const x=f2(l+i*slot+(slot-bw)/2); let y=t+ph;
    const nz=it.parts.filter(p=>p.n>0);
    nz.forEach((p,k)=>{const hh=p.n/top*ph,gap=k<nz.length-1?2:0; y-=hh; if(hh-gap>0.5) body+=`<rect class="mk" x="${x}" y="${f2(y+gap)}" width="${f2(bw)}" height="${f2(hh-gap)}" rx="3" fill="${p.color}"><title>${esc(it.label)} · ${esc(p.name)}: ${p.n}</title></rect>`;});
    if(i%pasoX===0||i===items.length-1) body+=`<text x="${f2(x+bw/2)}" y="${h-b+20}" text-anchor="middle" font-size="12" fill="${HEX.suave}">${esc(it.label)}</text>`;
  });
  body+=`<line x1="${l}" x2="${w-r}" y1="${t+ph}" y2="${t+ph}" stroke="#c9d1dc" stroke-width="1"/>`;
  return {svg:svgWrap(w,h,body,titulo),w,h};
}
function chartsEvolucion(){

  };

function compararCortes(a,b){
  const porKey=new Map(S.post.map(p=>[p.key,p]));
  const nom=k=>{const p=porKey.get(k);return p?nombreCompleto(p):'DNI '+k.split('#')[0];};
  const out={avanzaron:[],retrocedieron:[],cambioEstado:[],nuevos:[],salieron:[]};
  for(const [k,v] of Object.entries(b.mapa)){
    const o=a.mapa[k];
    if(!o){out.nuevos.push({k,nom:nom(k),txt:`${v[0]}/6 · ${EST_ORDEN[v[1]]}`});continue;}
    if(v[0]>o[0]) out.avanzaron.push({k,nom:nom(k),txt:`${o[0]}/6 → ${v[0]}/6`});
    if(v[0]<o[0]) out.retrocedieron.push({k,nom:nom(k),txt:`${o[0]}/6 → ${v[0]}/6`});
    if(v[1]!==o[1]) out.cambioEstado.push({k,nom:nom(k),txt:`${EST_ORDEN[o[1]]} → ${EST_ORDEN[v[1]]}`});
  }
  for(const k of Object.keys(a.mapa)) if(!b.mapa[k]) out.salieron.push({k,nom:nom(k),txt:'ya no aparece'});
  return out;
}

function ejecutarPruebas(){
  const out=[];
  const t=(nombre,esperado,obtenido,ok)=>out.push({nombre,esperado:String(esperado),obtenido:String(obtenido),ok:ok===undefined?String(esperado)===String(obtenido):!!ok});
  if(!S.datos){return [{nombre:'Hay un archivo importado',esperado:'sí',obtenido:'no',ok:false}];}
  const cfg=S.config;
  const carga=S.cargas.find(c=>c.id===cargaPrueba)||S.datos;
  const P=procesar(carga.filas).post;
  const E=new Map(P.map(p=>[p.fila,evaluar(p,{soloArchivo:true,cfg})]));
  const gLima=cfg.grupos.find(g=>Number(g.monto)===2475), gNorte=cfg.grupos.find(g=>Number(g.monto)===3500);
  const enG=(p,g)=>g&&grupoDe(p,cfg)===g;
  const lima=P.filter(p=>enG(p,gLima)), norte=P.filter(p=>enG(p,gNorte));
  const R=cfg.requisitos;
  t('Total de postulantes',85,P.length);
  t('Grupo Lima Norte (ahorro 2475)',64,lima.length);
  t('Lima Norte · Ventanilla',42,lima.filter(p=>distritoDe(p)==='Ventanilla').length);
  t('Lima Norte · Puente Piedra',22,lima.filter(p=>distritoDe(p)==='Puente Piedra').length);
  t('Grupo Norte Chico (ahorro 3500)',21,norte.length);
  const cnt=est=>P.filter(p=>E.get(p.fila).estado===est).length;
  t('Estado SIN INICIAR',64,cnt(EST.SIN));
  t('Estado FALTAN DOCUMENTOS',21,cnt(EST.FALTAN));
  t('Estado SOLICITAR CITA',0,cnt(EST.CITA));
  const dist=[0,0,0,0,0,0,0]; norte.forEach(p=>dist[E.get(p.fila).cumple]++);
  const fmtD=d=>d.map((n,i)=>n?`${n}×${i}/6`:'').filter(Boolean).join(', ');
  t('Norte Chico: distribución del avance','2×0/6, 8×1/6, 8×2/6, 3×3/6',fmtD(dist));
  const caso=(fila,apellido,distrito,cumpleIdx,faltaIdx,pctEsp,estadoEsp,faltanEsp)=>{
    const p=P.find(x=>x.fila===fila);
    if(!p){t(`Fila ${fila} (${apellido})`,'existe','no existe',false);return;}
    const e=E.get(fila);
    const nom=[p.apPat,p.apMat,p.nombres].join(' ');
    t(`Fila ${fila}: apellido ${apellido}${distrito?' · '+distrito:''}`,`${apellido}${distrito?' · '+distrito:''}`,`${nom}${distrito?' · '+distritoDe(p):''}`,nom.includes(apellido)&&(!distrito||distritoDe(p)===distrito));
    cumpleIdx.forEach(i=>t(`Fila ${fila}: ${R[i]} cumple`,'CUMPLE',e.reqs[i]));
    faltaIdx.forEach(i=>t(`Fila ${fila}: ${R[i]} en FALTA`,'FALTA',e.reqs[i]));
    t(`Fila ${fila}: % de avance`,pctEsp,pct(e.pct));
    if(estadoEsp) t(`Fila ${fila}: estado`,estadoEsp,e.estado);
    if(faltanEsp) t(`Fila ${fila}: requisitos faltantes`,faltanEsp.map(i=>R[i]).join(', '),e.faltan.join(', '));
  };
  caso(71,'REYNA','Huacho',[1,2],[],'33%',null,[0,3,4,5]);
  caso(83,'PABLO','Huacho',[1,2,4],[],'50%',null,[0,3,5]);
  caso(69,'SOSA','',[],[1,2],'0%',EST.FALTAN,null);
  t('Fila 10: DNI','00986080',(P.find(p=>p.fila===10)||{}).dni);
  t('Fila 8: DNI','07879109',(P.find(p=>p.fila===8)||{}).dni);
  t('Postulantes sin celular',9,P.filter(p=>!p.celulares.length).length);
  t('Celdas con dos celulares',1,P.filter(p=>p.celulares.length>=2).length);
  return out;
}

function hojaDesdeFilas(aoa,anchos){
  const ws=XLSX.utils.aoa_to_sheet(aoa);
  if(anchos) ws['!cols']=anchos.map(w=>({wch:w}));
  return ws;
}
function exportExcel(){
  const L=filtrados(); if(!L.length){toast('No hay filas para exportar');return;}
  const enc=S.datos.encabezados.map((h,i)=>h||ENC_DEF[i]);
  const cab=[...enc,'% Avance','Estado','Requisitos faltantes','Resultado de la visita'];
  const crudo=new Map(S.cargas.map(c=>[c.id,new Map(c.filas.map(f=>[f.fila,f.c]))]));
  const filas=L.map(({p,e})=>{
    const c=(crudo.get(p.cargaId)||new Map()).get(p.fila)||[], g=grupoDe(p);
    const r=[num(p.n)??p.n,p.dni,p.apPat,p.apMat,p.nombres,p.direccion,p.mz,p.lt,p.sublote,distritoDe(p),p.medidas,p.modulo,p.areaPlanilla??'',p.cargaNombre,p.cargaDni,
      p.celulares.length?p.celulares.map(x=>x.num).join(' / '):p.celularOrig,p.obs,p.ahorro??p.ahorroOrig,p.preAhorro,c[19]??'',c[20]??''];
    e.reqs.forEach((s,i)=>r.push(g&&g.sinCasillasWY&&(i===1||i===3)?'':s==='CUMPLE'));
    r.push(c[27]??'',c[28]??'');
    e.reqs.forEach(s=>r.push(s==='CUMPLE'?'X':s==='FALTA'?'FALTA':''));
    r.push(e.pct,e.estado,e.faltan.join(', '),e.resultado);
    return r;
  });
  const ws=hojaDesdeFilas([cab,...filas],cab.map((h,i)=>i===1||i===14?10:i>=NCOL?22:Math.min(Math.max(String(h).length,8),28)));
  for(let r=1;r<=filas.length;r++){
    for(const col of [1,14]){const a=XLSX.utils.encode_cell({r,c:col}); if(ws[a]){ws[a].t='s';ws[a].v=String(ws[a].v);}}
    const a=XLSX.utils.encode_cell({r,c:NCOL}); if(ws[a]) ws[a].z='0%';
  }
  const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,'TEST DOCUMENTARIO');
  guardarLibro(wb,`calificacion_postulantes_${hoyISO()}.xlsx`);
  toast(`${filas.length} filas exportadas`);
}

        cargarEstado(null); ultimoResultado=null; resultadosPruebas=null; reporteCache=null; guardar(); renderApp(); toast('Datos borrados');});
      break;
    case 'filtrar': F={q:'',distrito:'',grupo:'',estado:'',falta:'',visita:'',orden:F.orden}; if(el.dataset.campo) F[el.dataset.campo]=el.dataset.valor; irA('postulantes'); break;
    case 'limpiarFiltros': F={q:'',distrito:'',grupo:'',estado:'',falta:'',visita:'',orden:'fila'}; renderTabla(); break;
    case 'exportExcel': exportExcel(); break;
    case 'exportCita': exportCita(); break;
    case 'exportWa': exportWa(); break;
    case 'vistaVisitas': FV.vista=el.dataset.v; renderVisitas(); break;
    case 'ficha': ev.preventDefault(); abrirFicha(el.dataset.id); break;
    case 'cerrarFicha': cerrarFicha(); break;
    case 'cerrarFondo': if(ev.target===el) cerrarFicha(); break;
    case 'req': if(p){
      const i=Number(el.dataset.i), base=reqArchivo(p)[i], actual=p.reqManual[i]||base;
      const sig={PENDIENTE:'CUMPLE',CUMPLE:'FALTA',FALTA:'PENDIENTE'}[actual];
      const antes=evaluar(p).estado;
      p.reqManual[i]=sig===base?null:sig; registrar(p,'Requisito '+S.config.requisitos[i],actual,sig);
      const despues=evaluar(p).estado; if(antes!==despues) registrar(p,'Estado',antes,despues);
      guardar(); pintarFicha(); } break;
    case 'guardarVisita': if(p) guardarVisita(p); break;
    case 'copiarPlanilla': if(p){const fv=$('#formVisita');const set=(n,v)=>{if(v!=null&&v!=='')fv.querySelector(`[name=${n}]`).value=v;};
      set('medidas',p.medidas);set('modulo',p.modulo);set('areaConstruir',p.areaPlanilla);if(p.coord.ok){set('lat',p.coord.lat);set('lng',p.coord.lng);}
      toast('Datos copiados. Revise y pulse "Guardar visita".');} break;
    case 'gps': if(!navigator.geolocation){toast('Este equipo no permite obtener la ubicación');break;}
      navigator.geolocation.getCurrentPosition(pos=>{const fv=$('#formVisita');if(!fv)return;fv.querySelector('[name=lat]').value=pos.coords.latitude.toFixed(6);fv.querySelector('[name=lng]').value=pos.coords.longitude.toFixed(6);toast('Ubicación capturada. Pulse "Guardar visita".');},()=>toast('No se pudo obtener la ubicación'),{enableHighAccuracy:true,timeout:15000});
      break;
    case 'borrarVisita': if(p) preguntar({titulo:'¿Borrar la visita?',texto:'Se borran los datos de la visita de este postulante.',ok:'Borrar visita',peligro:true}).then(si=>{if(!si)return;const antes=evaluar(p).estado;registrar(p,'Visita','registrada','borrada');p.visita=visitaVacia();const d=evaluar(p).estado;if(antes!==d)registrar(p,'Estado',antes,d);guardar();pintarFicha();}); break;
    case 'aplicarDistrito': {const q=S.post.find(x=>x.id===el.dataset.id); if(q){registrar(q,'Distrito',distritoDe(q),el.dataset.valor);q.distritoManual=el.dataset.valor;guardar();renderCalidad();toast('Distrito actualizado');}} break;
    case 'repEml': conEspera(el,descargarEml); break;
    case 'repCopiar': conEspera(el,copiarReporte); break;
    case 'repPng': conEspera(el,descargarPngs); break;
    case 'tabConfig': CT=el.dataset.v; renderConfig(); break;
    case 'agregarGrupo': if(leerConfigForm()){S.config.grupos.push({monto:0,etiqueta:'Nuevo grupo',sinCasillasWY:false});renderConfig();} break;
    case 'quitarGrupo': if(leerConfigForm()){S.config.grupos.splice(Number(el.dataset.i),1);renderConfig();} break;
    case 'guardarConfig': if(leerConfigForm()){guardar();toast('Configuración guardada');renderApp();} break;
    case 'restablecerConfig': preguntar({titulo:'¿Restablecer las reglas?',texto:'Vuelven a los valores por defecto el área mínima, los grupos y los nombres de requisitos.',ok:'Restablecer'}).then(si=>{if(!si)return;Object.assign(S.config,{areaMin:CONFIG_DEF.areaMin,grupos:clon(CONFIG_DEF.grupos),requisitos:clon(CONFIG_DEF.requisitos)});guardar();renderConfig();}); break;
    case 'agregarViv': {const n=$('#nuevoViv').value.trim(); if(!n){toast('Escriba el nombre del requisito');break;} leerVivienda(); S.config.vivienda.push({id:'v'+Date.now().toString(36),nombre:n}); guardar(); renderConfig();} break;
    case 'quitarViv': leerVivienda(); S.config.vivienda.splice(Number(el.dataset.i),1); guardar(); renderConfig(); break;
    case 'guardarMensajes': leerVivienda(); Object.assign(S.config,{tplFaltan:$('#cTplF').value,tplCita:$('#cTplC').value,correoPara:$('#cPara').value.trim(),correoFirma:$('#cFirma').value.trim()}); guardar(); toast('Guardado'); break;
    case 'agregarUsuario': conEspera(el,agregarUsuario); break;
    case 'quitarUsuario': {const u=STORE.usuarios.find(x=>x.u===el.dataset.u); if(!u) break;
      if(u.rol==='admin'&&STORE.usuarios.filter(x=>x.rol==='admin').length<2){toast('Debe quedar al menos un administrador');break;}
      preguntar({titulo:`¿Quitar el acceso de ${u.nombre}?`,texto:'Ya no podrá ingresar en este navegador.',ok:'Quitar acceso',peligro:true}).then(si=>{if(si){STORE.usuarios=STORE.usuarios.filter(x=>x!==u);guardarAhora().then(()=>{toast('Usuario quitado');renderConfig();});}});} break;
    case 'resetUsuario': {const u=STORE.usuarios.find(x=>x.u===el.dataset.u); if(!u) break;
      preguntar({titulo:`Nueva contraseña para ${u.nombre}`,texto:'Mínimo 8 caracteres. Entréguesela en persona.',ok:'Guardar contraseña',campo:{tipo:'password'}}).then(n=>{
        if(n==null) return; if(n.length<8){toast('Mínimo 8 caracteres');return;}
        conEspera(el,async()=>{Object.assign(u,await envolver(n,AUTH.raw));await guardarAhora();toast('Contraseña actualizada');});});} break;
    case 'cambiarPass': conEspera(el,cambiarPass); break;
  }
});
document.addEventListener('input',ev=>{
  ultimaActividad=Date.now();
  if(AUTH&&ev.target.id==='fq'){F.q=ev.target.value;pintarFilas();}
});
let tPrevia=null;
document.addEventListener('change',ev=>{
  const t=ev.target;
  if(!AUTH) return;
  if(t.dataset.f){F[t.dataset.f]=t.value;pintarFilas();return;}
  if(t.id==='fvDistrito'){FV.distrito=t.value;renderVisitas();return;}
  if(t.id==='feDesde'||t.id==='feHasta'){FE.desde=$('#feDesde').value;FE.hasta=$('#feHasta').value;renderEvolucion();return;}
  if(t.id==='cargaPrueba'){cargaPrueba=t.value;resultadosPruebas=null;$('#testsOut').innerHTML='';return;}
  if(['rAlcance','rLista','rContacto','rComentario','rPara'].includes(t.id)){clearTimeout(tPrevia);tPrevia=setTimeout(actualizarPrevia,150);return;}
  if(t.dataset.act2==='distrito'){const p=S.post.find(x=>x.id===fichaId);if(!p)return;const nv=t.value||null;registrar(p,'Distrito',distritoDe(p),nv||('del archivo: '+(p.distritoOrig||'vacío')));p.distritoManual=nv;guardar();pintarFicha();return;}
  if(t.id==='fileXlsx'&&t.files.length){const fs=[...t.files];t.value='';leerArchivos(fs);return;}
  if(t.id==='fileJson'&&t.files[0]){
    const f=t.files[0]; t.value='';
    f.text().then(async s=>{
      const d=JSON.parse(s);
      if(!d||!d.config||!((d.v===1&&Array.isArray(d.post))||(d.v===2&&Array.isArray(d.cargas)))) throw new Error('El archivo no es un respaldo de esta app.');
      const n=migrar(d);
      if(S.datos&&!await preguntar({titulo:'¿Restaurar el respaldo?',texto:`Se reemplazan los datos actuales (${S.cargas.length} archivos, ${S.post.length} postulantes) por los del respaldo (${n.cargas.length} archivos).`,ok:'Restaurar'})) return;
      cargarEstado(d); ultimoResultado=null; guardar(); resultadosPruebas=null; reporteCache=null; toast('Respaldo restaurado'); renderApp();
    }).catch(err=>toast('No se pudo restaurar: '+err.message));
  }
});
document.addEventListener('keydown',ev=>{ultimaActividad=Date.now(); if(ev.key==='Escape'&&fichaId) cerrarFicha();});
document.addEventListener('touchstart',()=>{ultimaActividad=Date.now();},{passive:true});
setInterval(()=>{if(AUTH&&Date.now()-ultimaActividad>INACTIVIDAD_MIN*60000) bloquear(`La sesión se cerró por ${INACTIVIDAD_MIN} minutos de inactividad.`);},30000);

renderLogin();
</script>
</body>
</html>
